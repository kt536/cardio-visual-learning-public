:root{--ink:#162437;--blue:#215f9a;--blue2:#eaf3fb;--border:#d7e1ec;--bg:#f5f8fc;--mute:#5d6d80;--green:#eaf8f0;--warn:#fff8ec}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
header{background:#14304f;color:#fff;padding:30px max(20px,calc((100vw - 1100px)/2))}

main{max-width:1100px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:10px 0 14px;z-index:10}
.tabs button{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--ink)}
.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(31,61,91,.06)}
.label{display:inline-block;background:#edf4fb;color:var(--blue);font-weight:700;border-radius:999px;padding:4px 10px;font-size:12px;margin-bottom:6px}
h2{font-size:24px;margin:0 0 6px}h3{font-size:18px;margin:16px 0 8px}h4{font-size:16px;margin:10px 0 4px}.sub{font-size:14px;color:var(--mute)}

.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.columns3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.info{border-left:4px solid #3d84c6;background:#eef6fd;padding:12px 14px;border-radius:6px;margin:12px 0}.caution{border-left:4px solid #d79b3f;background:var(--warn);padding:12px 14px;border-radius:6px;margin:12px 0}
.glossary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.term{background:#f8fbfe;border:1px solid #e0e8f1;border-radius:12px;padding:12px}.term b{display:block;color:#13436b;margin-bottom:4px}

.question{background:#f4f8fc;border:1px solid var(--border);padding:14px;border-radius:12px;margin:10px 0;font-weight:700}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answers button{padding:12px;border-radius:12px;border:1px solid var(--border);background:#fff;text-align:left;cursor:pointer}.feedback{margin-top:10px;min-height:56px;background:#f8fbfe;border-radius:12px;padding:12px;border:1px solid #e5edf5}.actions{margin-top:12px}.actions button{padding:10px 14px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.figure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.figure-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fcfdff}.figure-card h4{margin-top:0}.svgbox{width:100%;overflow:hidden;border:1px solid #e5edf5;border-radius:12px;background:#fff}
.note{font-size:13px;color:var(--mute)}
.pill{display:inline-block;background:#e8f1fb;padding:4px 10px;border-radius:999px;margin:2px 6px 2px 0;font-size:13px}.src{font-size:13px;color:var(--mute);margin-top:8px}

  <h1>Prehospital ALS 学習ノート 第4版</h1>
  <p>AHA 2025 CPR / ECC Guidelines の公開資料をもとにした個人の学習用ノートです。用語の補足、深掘り解説、気道確保のイラストを含みます。</p>
  <p>狙い：<b>「何となく分かる」→「なぜそうなるかを説明できる」</b> に近づくこと。</p>
</header>
<main><div class="card" style="border-left:5px solid #2368ad"><b>最初に覚える用語：</b>ROSC = <b>Return of Spontaneous Circulation（自発循環再開）</b>。心停止後、心臓が再び血液を送り出し、脈拍や血圧などの自発的な循環が戻ることです。以下、初めて出てきてもこの意味で読めます。</div>
  <div id="tabs" class="tabs"></div>
  <div id="panels"></div>
</main>

const chapters=[
{
 title:'① 薬剤投与', en:'Drug Therapy', src:'als',
 intro:'心停止中の薬剤は、<b>「電気の問題を止める薬」</b>と<b>「CPR中の循環を支える薬」</b>で役割が違います。まずは役割の違いを整理します。',
 flow:['心停止 → 有効な拍出がない','CPR中も血流は正常時より少ない','Epinephrineで冠灌流圧（心筋へ血液を送るための圧）を高める','VF/pVTが続けば抗不整脈薬を考慮'],
 glossary:[['Coronary Perfusion Pressure（冠灌流圧）','心筋に血液が流れ込むための圧。ROSCに関係する重要な概念です。'],['IV / IO','IVは静脈路、IOは骨髄内路。心停止では迅速に薬剤投与経路を確保します。'],['Shockable rhythm（ショック適応リズム）','VFと脈なしVT。除細動が中心になります。'],['Non-shockable rhythm（ショック非適応リズム）','PEAとAsystole。ショックではなくCPR、Epinephrine、原因検索が中心です。']],
 sections:[['Epinephrine（アドレナリン）','主にα受容体を介して末梢血管を収縮させます。すると大動脈拡張期圧が上がり、CPR中の冠灌流圧の改善を狙えます。<b>直接VFを止める薬ではありません。</b> 成人心停止では通常 1 mg IV/IO を 3〜5分ごとに投与します。<br><b>投与のタイミング（AHA 2025）：</b>ショック非適応リズム（PEA・心静止）では<b>できるだけ早く</b>、ショック適応リズム（VF・pVT）では<b>最初の除細動が成功しなかった後</b>に投与するのが合理的とされています。'],['Amiodarone / Lidocaine（抗不整脈薬）','どちらも、除細動を繰り返してもVF / pulseless VT が持続する場合に使用を考慮する薬です。Amiodaroneは複数のイオンチャネルに、Lidocaineは主にNa⁺チャネルに作用します。<b>除細動の代わりではなく、補助的に使う</b>ものです（AHA 2025 の推奨は「考慮してよい」程度）。用量はこのノートでは確認していないため、ガイドライン本文と所属先プロトコルで確認してください。'],['なぜPEA/心静止ではEpinephrineが前に来る？','PEAや心静止では、除細動で止めるべき無秩序な心室電気活動がありません。そのため、まずはCPRで最低限の灌流を保ちつつ、Epinephrineで循環を支え、可逆的原因（治療によって改善できる心停止の原因。低酸素、循環血液量減少、アシドーシス〔血液が酸性に傾くこと〕など）を探す考え方になります。']],
 why:[['なぜ除細動だけで終わらないの？','除細動でVF/pVTが止まっても、心筋に血液が戻らなければ自己心拍は再開しにくいからです。電気を整えることと、灌流を保つことは別の問題です。'],['なぜAmiodarone/Lidocaineは最初から打たないの？','VF/pVTでは最も効果が大きい初期介入は早期除細動だからです。薬剤はその後の補助です。']],
 point:'現場では<b>ショック・CPR・薬剤・静脈路/骨髄路の確保</b>を並行して進めます。投薬やショックの時刻を記録しておくと、次の投与のタイミング判断や引き継ぎ、振り返りに役立ちます。',
 q:['Epinephrineを心停止中に投与する主な目的は？',['VFを直接停止させる','CPR中の冠灌流圧を高める','血栓を溶かす','換気量を増やす'],1,'主に末梢血管収縮を通じて冠灌流圧を高め、ROSCの可能性を上げることを狙います。']
},
{
 title:'② 気道・呼吸管理', en:'Airway & Ventilation', src:'als',
 intro:'この章は特にイメージしづらいので、<b>「空気の通り道」と「デバイスがどこにあるか」</b>を図で整理します。気道確保（肺まで空気が通る経路を保つこと）は、単に管を入れることではなく、<b>酸素化・換気・誤嚥リスク・CPR中断</b>のバランスを取る作業です。',
 flow:['意識消失 → 気道閉塞しやすい','BVM / SGA / ETIで空気の通り道を確保','肺胞でガス交換','ETCO₂（呼気中のCO₂）で換気と肺血流を補助評価'],
 glossary:[['Airway（気道）','鼻・口から咽頭、喉頭、気管へ続く空気の通り道です。'],['Ventilation（換気）','肺に空気を出し入れすること。酸素を入れ、CO₂を出します。'],['Oxygenation（酸素化）','血液中に酸素を取り込むこと。換気と関連しますが同じ意味ではありません。'],['Aspiration（誤嚥）','胃内容物などが気道に入ること。肺炎や低酸素の原因になります。'],['Capnography（カプノグラフィ）','呼気中CO₂を連続波形で監視する方法。挿管確認やROSC評価に役立ちます。'],['ETCO₂（呼気終末二酸化炭素）','息を吐き終わったときのCO₂。組織で作られ、血液が肺へ運び、呼気として排出するため、換気だけでなく肺血流の影響も受けます。']],
 figure:airwayIllustrations+`<div class="card" style="padding:14px;margin-top:12px"><h4>ETCO₂が循環とつながる理由</h4><div class="flow"><div class="step">① 組織がCO₂を作る</div><span class="arr">➜</span><div class="step">② 血液が肺へ運ぶ</div><span class="arr">➜</span><div class="step">③ 呼気にCO₂が出る</div><span class="arr">➜</span><div class="step">④ ETCO₂を測定</div></div><h4>心停止 → CPR → ROSCのイメージ</h4><svg viewBox="0 0 830 255" role="img" aria-label="心停止からCPR、ROSC後のETCO2変化を示す概念図。心停止とCPR中は低く、ROSC後は突然上昇する場合がある。" style="width:100%;height:auto;background:#fff;border:1px solid #e0e8f1;border-radius:10px"><rect x="36" y="24" width="242" height="187" fill="#f8fafc"/><rect x="280" y="24" width="258" height="187" fill="#eef6fe"/><rect x="540" y="24" width="260" height="187" fill="#eaf8f0"/><line x1="45" y1="212" x2="800" y2="212" stroke="#64748b" stroke-width="2"/><line x1="45" y1="25" x2="45" y2="212" stroke="#64748b" stroke-width="2"/><text x="65" y="43" font-size="16" font-weight="700" fill="#364152">心停止</text><text x="310" y="43" font-size="16" font-weight="700" fill="#364152">CPR中</text><text x="575" y="43" font-size="16" font-weight="700" fill="#216b46">ROSC後</text><path d="M65 192 L270 189 Q300 176 332 184 T405 172 T482 177 L525 180 Q545 159 553 100 Q565 74 600 77 L790 70" fill="none" stroke="#2368ad" stroke-width="6" stroke-linecap="round"/><path d="M540 49 L540 212" stroke="#0d9488" stroke-dasharray="5 6" stroke-width="2"/><text x="8" y="122" font-size="14" fill="#334155" transform="rotate(-90 18 120)">ETCO₂（模式値）</text><text x="65" y="238" font-size="13" fill="#64748b">肺へのCO₂運搬が少ない</text><text x="306" y="238" font-size="13" fill="#64748b">肺血流が一部回復</text><text x="560" y="238" font-size="13" fill="#216b46">突然の持続的上昇が起こる場合</text></svg><div class="info"><b>読み方：</b>心停止ではCO₂を肺へ運ぶ血流が低下。胸骨圧迫で肺血流が部分的に回復し、ROSCでは自己心拍によって血流が大きく改善することがあります。換気などが同じ条件なら、ETCO₂が突然上がることがあります。</div><div class="caution"><b>注意：</b>これは現象を示した模式グラフで、必ずこの変化になるわけではありません。AHA 2025は「ETCO₂の急上昇をROSC検出の補助に使ってよい」としますが、普遍的なカットオフ値はありません。換気量、CPR品質、薬剤投与、気道管理、心停止の原因にも影響されます。必ず他の臨床所見と合わせて判断します。</div></div>`,
 sections:[['BVM — Bag-Valve-Mask（バッグバルブマスク）','もっとも基本的な換気手段です。顔面にマスクを密着させ、バッグを押して空気を送ります。<b>利点</b>はすぐ使えること。<b>難しさ</b>は、マスクの密着不良、舌根沈下、過換気（必要以上の回数や量で換気すること）、胸骨圧迫中にうまく合わせる必要がある点です。二人法で、一人が気道開通とマスク保持、もう一人がバッグ圧迫を行うと安定しやすいです。'],['SGA — Supraglottic Airway（声門上気道デバイス）','i-gel や LMA などを含みます。先端は<b>気管の中ではなく、声門の上</b>に位置します。BVMより換気を安定させやすいことがありますが、ETIほど気道を完全に隔離するわけではありません。状況により迅速に使える点が病院前での利点です。'],['ETI — Endotracheal Intubation（気管挿管）','チューブを<b>声門を越えて気管内</b>へ進めます。正しく入れば換気経路を確保しやすく、気道保護の点でも有利ですが、技術が必要で、失敗すると食道挿管やCPR中断につながります。AHAでも、成功率や合併症を含む継続的な品質評価が重要とされています。'],['なぜETCO₂が大事？','組織でCO₂が作られる → 血液がCO₂を肺へ運ぶ → 肺で呼気に出る → ETCO₂として測る、という順番です。心停止中は肺へ届く血流が少なくETCO₂も低くなりがちです。CPRで肺血流が増えれば上がることがあり、ROSC（自発循環再開）で急上昇することがあります。ただし換気、薬剤、気道状態にも影響されるため、単独でROSCを確定できません。'],['高度な気道確保後の換気','成人心停止では通常、胸骨圧迫を継続しながら<b>6秒に1回（毎分10回）</b>を目安に換気します。過換気すると胸腔内圧が上がり、静脈還流が減り、かえって心拍出に不利になることがあります。']],
 why:[['なぜBVMだけでは不十分なことがある？','マスク密着、気道開通、換気量のコントロールが難しく、長時間では不安定になりやすいからです。'],['なぜETIがいつも最善ではないの？','技術が必要で、挿管に集中しすぎるとCPR中断が増える可能性があるからです。現場では「最も高級な手技」より「最も安定してできる手技」が重要な場合があります。'],['なぜ過換気が危険？','換気しすぎると胸腔内圧が上がり、静脈還流が減り、CPRの有効性を下げる可能性があるためです。'],['ETCO₂とSpO₂はどう違う？','SpO₂は血液中のヘモグロビンがどの程度酸素と結合しているかを示す酸素化の指標。ETCO₂は呼気中のCO₂を示し、換気と肺血流の両方に影響されます。'],['ETCO₂が急に上がったらROSC確定？','いいえ。突然の持続的上昇はROSCを疑う（自発循環が再開した可能性を考える）手がかりですが、換気の変化やCPRの質、薬剤などの影響もあるため、脈拍・血圧などと合わせて確認します。']],
 point:'SpO₂ と ETCO₂ は別の指標です。<b>SpO₂ は酸素化、ETCO₂ は換気と肺血流の手がかり</b>。どちらか一方だけで判断せず、波形と数値を合わせて見ます。',
 q:['CPR中にETCO₂が突然大きく上昇して持続した。正しい理解は？',['それだけでROSC確定','ROSCの可能性があり他の所見と確認','必ずチューブが抜けた','換気を毎分30回にする'],1,'持続的ETCO₂上昇はROSCを示唆することがありますが、単独で診断はできません。脈拍、血圧波形、患者状態などと合わせて確認します。']
},
{
 title:'③ ROSC後の対応', en:'Post–Cardiac Arrest Care', src:'post',
 intro:'ROSC（Return of Spontaneous Circulation：自発循環再開）はゴールではなく、<b>次の管理フェーズへの入口</b>です。再低酸素、低血圧、再不整脈、脳障害を防ぐための監視と原因検索が必要です。',
 flow:['ROSC → 自発循環再開','酸素化・換気・血圧を安定化','12誘導ECGなどで原因検索','病院で継続的な脳・体温・循環管理へ'],
 glossary:[['ROSC','Return of Spontaneous Circulation。自発的な脈拍・循環が戻ること。'],['MAP','Mean Arterial Pressure（平均動脈圧）。臓器灌流の目安になります。'],['Hyperoxia','過剰酸素。低酸素だけでなく過剰酸素も避ける考え方が重要です。'],['12-lead ECG','心停止原因としてのACSや再灌流の必要性を考えるための重要な検査です。']],
 sections:[['Oxygenation（酸素化）','ROSC直後は、SpO₂ が確実に測れるようになるまで<b>100% 酸素</b>を使います。SpO₂ が信頼できるようになれば<b>90〜98%</b>を目標に下げていきます。低酸素は危険ですが、常に100%を目指すわけではありません。'],['Ventilation（換気）','PCO₂ 35〜45 mmHg を目標に、血液ガス・ETCO₂・臨床状況を総合して調整します。CO₂が高すぎても低すぎても脳血流などに影響します。'],['Hemodynamics（血行動態）','MAP 65 mmHg以上を目標に、低血圧（血圧が臓器に血液を送るには不十分な状態）を避けます。理由は、脳や心筋に十分な血液が届かないと二次障害が進みうるからです。'],['12-lead ECG と原因検索','ST上昇、虚血所見、不整脈などを評価します。心停止の原因が冠動脈関連かどうかを考える重要な手がかりですが、正常に近いECGだけで原因を否定はできません。<br><b>ST 上昇が続く場合：</b>心臓が原因と疑われ、ECG で ST 上昇が持続していれば、意識が戻っていなくても<b>緊急の冠動脈造影</b>を行うべきとされています（AHA 2025）。'],['Temperature Control（体温管理）','意識が戻らない成人では、32〜37.5°Cの計画的な体温管理を少なくとも36時間行うことが合理的とされています。主に病院で継続される管理です。<br><b>病院前で注意：</b>体温を下げる目的で、病院前に冷たい輸液を急速に投与することは<b>推奨されていません</b>（効果がないため）。']],
 why:[['なぜROSC後もモニタリングが必要？','見かけ上脈拍が戻っても、再び循環が悪化したり、不整脈が再発したり、低酸素・低血圧で脳障害が進んだりする可能性があるからです。'],['なぜ12誘導ECGが重要？','心停止の原因がACSであれば、緊急カテーテル治療など次の治療方針に影響するからです。']],
 point:'病院前では、ROSC 後に<b>搬送しながら監視する</b>時間が重要です。ECG、血圧、SpO₂、ETCO₂ を続けて確認し、再び心停止になったらすぐ CPR に戻れるようにしておきます。',
 q:['ROSC後、信頼できるSpO₂値が得られた成人患者の酸素化目標は？',['常に100%','70〜80%','90〜98%','数値は確認不要'],2,'AHA 2025では、信頼できる測定ができればSpO₂ 90〜98%を目標に酸素を調整します。']
},
{
 title:'④ ALSアルゴリズム', en:'Integrated Algorithm', src:'als',
 intro:'ALSアルゴリズムは、<b>CPR・リズム判定・除細動・薬剤・原因検索を2分ごとに回すループ</b>です。最初の分岐は「ショック適応か否か」です。',
 flow:['心停止認識 → CPR開始','モニター装着・リズム評価','VF/pVT か PEA/心静止か','2分ごとに再評価しながら介入を継続'],
 glossary:[['VF / pVT','VFは心室細動、pVTは脈なし心室頻拍。ショック適応です。'],['PEA','Pulseless Electrical Activity。電気活動はあるが有効な脈がない状態です。'],['Asystole','心静止。ショック非適応です。'],['Hs & Ts','可逆的原因の覚え方。低酸素、低容量、アシドーシス、低/高K、低体温、緊張性気胸、心タンポナーデ、毒物、肺血栓、冠動脈血栓など。']],
 sections:[['Shockable：VF / pulseless VT','優先順位は<b>高品質CPRと早期除細動</b>です。ショック後は直ちにCPRを再開し、次の2分サイクルへ入ります。除細動だけで長く止まってはいけません。<br><b>エネルギー量：</b>二相性除細動器では、1回目は<b>メーカー推奨のエネルギー量</b>が目安です。推奨値が分からなければ最大出力を考慮し、2回目以降はより高いエネルギーも考慮できます。<br><b>3回以上ショックしても VF/pVT が続くとき：</b>パッド位置を変える方法（ベクトル変更）や、2台の除細動器で続けてショックする方法（二重連続除細動）がありますが、AHA 2025 では<b>どちらも有用性は確立していない</b>とされています。'],['Non-shockable：PEA / Asystole','ショックは行いません。CPRを継続し、Epinephrineを早期に投与し、Hs & Ts を考えます。途中でリズムがVF/pVTへ変化することもあり、その場合はショック経路へ移ります。'],['なぜ2分ごとなのか','短すぎると胸骨圧迫の中断が増え、長すぎるとリズム変化や治療効果を見逃します。2分はCPR継続と再評価のバランスを取る目安です。']],
 why:[['なぜショック後すぐ脈を触らないの？','脈確認のために圧迫を止める時間が長くなると、せっかく作っていた灌流が途切れるためです。まずCPR再開が優先です。'],['なぜPEAにショックしないの？','PEAは「電気がない」のではなく、「電気はあるが拍出がない」状態で、除細動で止めるべきVFのような電気的無秩序ではないためです。']],
 point:'アルゴリズムは<b>チームワークと時間管理</b>の問題でもあります。リズム判定・ショック・CPR の質・記録の役割を分担し、2分ごとの区切りを全員で共有します。',
 q:['PEAと診断された成人心停止患者。優先されるのは？',['直ちに除細動','CPRと早期Epinephrine、可逆的原因の検索','同期カルディオバージョン','ROSC後の体温管理だけ'],1,'PEAはショック非適応です。CPR、早期Epinephrine、原因検索を重視します。']
},
{
 title:'⑤ Systems of Care', en:'EMS, Handover & Quality Improvement', src:'system',
 intro:'救命は一台の機器だけでは成立しません。<b>発見・通報・市民CPR/AED・EMS・病院・回復</b>の流れ全体を「一つのシステム」として見る必要があります。',
 flow:['発見・通報','市民によるCPR/AED','EMSによるALS・搬送','病院治療・回復・振り返り'],
 glossary:[['Chain of Survival','救命の連鎖。予防・早期認識・CPR・除細動・心停止後ケア・回復。AHA 2025 では乳児・小児・成人で共通の1本の連鎖に統一されました（新生児を除く）。'],['Dispatcher-Assisted CPR','指令員が電話口でCPRを口頭指導すること。'],['Handover','救急隊から病院へ情報を引き継ぐこと。'],['Quality Improvement','データを集め、振り返り、改善する活動。']],
 sections:[['Chain of Survival','救命の連鎖は、予防と備え → 早期認識・通報 → 高品質CPR → 除細動 → 心停止後ケア → 回復です。どこか一つだけ強くても、全体がつながらなければ結果は限られます。'],['Dispatcher-Assisted CPR','市民がCPRをためらう状況でも、指令員が心停止を早く認識し、口頭で胸骨圧迫を開始させることが重要です。'],['Public Access Defibrillation','AEDは台数だけでなく、アクセスしやすさ、設置場所の認知、保守、教育、実際に取りに行ける距離・時間が重要です。'],['Handover','病院前から病院への情報伝達では、時刻、バイスタンダーCPR、AED/除細動、リズム変化、投薬、ROSC、バイタルが特に重要です。'],['Quality Improvement','ROSC、生存退院、神経学的転帰だけでなく、CPR開始までの時間、ショックまでの時間、胸骨圧迫の質、挿管成功率なども改善の材料になります。']],
 why:[['なぜ1つの職種や1台の機器だけでは足りないの？','結果は個々の手技や機器の性能だけでなく、通報・市民の CPR/AED・救急隊・病院の連携や、教育、データの振り返りで大きく変わるためです。'],['なぜ「回復」まで含めるの？','生き返るだけでなく、その後の生活の質や社会復帰まで含めて救命の成果と考えるからです。']],
 point:'救命は<b>通報から回復までのつながり</b>で決まります。病院前の情報（時刻、バイスタンダー CPR、ショック、投薬、ROSC）を正確に引き継ぎ、記録を振り返りと改善に使います。',
 q:['Systems of Careの考え方に最も近いものは？',['AEDの設置台数だけを評価する','救急隊到着後の医療だけ評価する','通報から回復までの連携と品質改善を評価する','個人の手技だけを評価する'],2,'救命は一連の連携体制で実現します。データ収集と改善が重要です。']
}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function build(){const tabs=document.getElementById('tabs');const panels=document.getElementById('panels');chapters.forEach((c,i)=>{
  const b=document.createElement('button');b.textContent=c.title;b.onclick=()=>show(i);tabs.appendChild(b);
  const sec=document.createElement('section');sec.className='panel';
  const flow=c.flow.map((t,j)=>`<div class="step">${t}</div>${j<c.flow.length-1?'<span class="arr">➜</span>':''}`).join('');
  const glossary=c.glossary.map(x=>`<div class="term"><b>${x[0]}</b>${x[1]}</div>`).join('');
  const sections=c.sections.map((x,j)=>`<details ${j===0?'open':''}><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');
  const why=c.why.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');
  sec.innerHTML=`<article class="card"><div class="label">Chapter ${i+1} / 5</div><h2>${c.title}</h2><div class="sub">${c.en}</div><p>${c.intro}</p><h3>① 仕組みの流れ</h3><div class="flow">${flow}</div><h3>まず用語をおさえる</h3><div class="glossary">${glossary}</div>${c.figure?'<h3>図でイメージする</h3>'+c.figure:''}<h3>② 仕組みを理解する</h3>${sections}<h3>ここが分かりにくい：なぜ？を深掘り</h3>${why}<h3>③ 理解度チェック</h3><div class="question">${c.q[0]}</div><div id="answers-${i}" class="answers"></div><div id="feedback-${i}" class="feedback">選択肢を選ぶと理由を表示します。</div><div class="actions"><button id="next-${i}" onclick="nextChapter(${i})" disabled>${i===chapters.length-1?'最初の章に戻る':'次のテーマへ →'}</button> <button onclick="resetQuiz(${i})" style="background:#6c7b8f">もう一度解く</button></div><h3>④ 現場での要点</h3><div class="info">${c.point}</div><div class="caution"><b>注意：</b>このHTMLは学習用の整理です。実際の患者対応や適応判断は、資格・所属先プロトコル・公式ガイドラインに従ってください。</div><div class="src">主要参照：<a href="${sources[c.src]}" target="_blank" rel="noopener noreferrer">AHA 2025 公式資料 ↗</a></div></article>`;
  panels.appendChild(sec); renderQuiz(i);
}); show(0);}
function renderQuiz(i){const a=document.getElementById('answers-'+i),c=chapters[i];a.innerHTML='';c.q[1].forEach((opt,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'．'+opt;b.onclick=()=>answer(i,j);a.appendChild(b)});document.getElementById('feedback-'+i).textContent='選択肢を選ぶと理由を表示します。';document.getElementById('next-'+i).disabled=true}
function answer(i,j){const c=chapters[i],ok=j===c.q[2];document.querySelectorAll('#answers-'+i+' button').forEach((b,k)=>{b.disabled=true;if(k===c.q[2]){b.style.borderColor='#24845f';b.style.background='#eaf8f0'}else if(k===j){b.style.borderColor='#cb6559';b.style.background='#fff0ee'}});document.getElementById('feedback-'+i).textContent=(ok?'正解です。 ':'復習しましょう。 ')+c.q[3];document.getElementById('next-'+i).disabled=false}
function resetQuiz(i){renderQuiz(i)}
function nextChapter(i){show((i+1)%chapters.length)}
function show(i){document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',i===j));document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));window.scrollTo({top:0,behavior:'smooth'})}
build();
</script>
</body>
</html>
